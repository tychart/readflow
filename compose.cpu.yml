# ReadFlow — no-GPU (CPU) deployment.
#
#   podman compose -f compose.cpu.yml up -d          # or: docker compose -f compose.cpu.yml up -d
#   podman compose -f compose.cpu.yml up -d --build # build from this checkout
#
# The api image is the CPU variant (CPU-only torch). It works without any NVIDIA
# driver or container toolkit, but synthesising a book on a CPU is very slow, so
# this is best for trying the app out and for UI development. Long jobs are
# practical on a GPU (see compose.yml).
#
# Tip: for a fast UI-only stack, use the fake provider so no model ever loads:
#   READFLOW_TTS_PROVIDER=fake podman compose -f compose.cpu.yml up -d

name: readflow

services:
  pg:
    image: ${READFLOW_PG_IMAGE:-docker.io/library/postgres:18}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-readflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-readflow}
      POSTGRES_DB: ${POSTGRES_DB:-readflow}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-readflow} -d ${POSTGRES_DB:-readflow}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    image: ${READFLOW_API_IMAGE:-ghcr.io/tychart/readflow-api:latest-cpu}
    build:
      context: server
      target: cpu
    restart: unless-stopped
    depends_on:
      pg:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://readflow:readflow@pg:5432/readflow}
      READFLOW_COOKIE_SECURE: ${READFLOW_COOKIE_SECURE:-auto}
      READFLOW_TTS_PROVIDER: ${READFLOW_TTS_PROVIDER:-qwen}
      READFLOW_SCHEDULER_AUTOSTART: ${READFLOW_SCHEDULER_AUTOSTART:-true}
      READFLOW_TEMP_DIR_NAME: ${READFLOW_TEMP_DIR_NAME:-readflow}
      # Rendered audio lives on a volume, not in the container's /tmp.
      READFLOW_MEDIA_DIR: /app/server/.media
      HF_HOME: /home/readflow/.cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf-cache:/home/readflow/.cache/huggingface
      # Rendered audio: kept until the user purges it, so it must
      # outlive the container.
      - media:/app/server/.media
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=4)"
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

  web:
    image: ${READFLOW_WEB_IMAGE:-ghcr.io/tychart/readflow-web:latest}
    build:
      context: web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      READFLOW_API_UPSTREAM: api:8000
    ports:
      - "${READFLOW_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  hf-cache:
  media:
  pgdata:
