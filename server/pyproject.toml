[project]
name = "readflow-server"
version = "0.1.0"
description = "ReadFlow backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.12",
  "pydantic>=2.11.4",
  "pydantic-settings>=2.9.1",
  "python-multipart>=0.0.20",
  "qwen-tts",
  # Pinned deliberately. PyPI torch 2.9 is a CUDA 12.8 build that matches the
  # nvidia/cuda:12.8 base images AND has a prebuilt flash-attn 2.8.3 wheel
  # (cu12torch2.9), so the container never has to compile flash-attn.
  # torch 2.11 moved to CUDA 13 and has no matching flash-attn wheel.
  "torch==2.9.0",
  "torchaudio==2.9.0",
  "uvicorn[standard]>=0.34.2"
]

[project.optional-dependencies]
cuda = [
  "flash-attn==2.8.3"
]
utils = [
  "psutil>=6.0.0",
]
dev = [
  "httpx>=0.28.1",
  "pyright>=1.1.400",
  "pytest>=8.3.5",
  "pytest-asyncio>=0.26.0",
  "pytest-cov>=6.1.1",
  "ruff>=0.11.8"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.extra-build-dependencies]
flash-attn = [
  { requirement = "torch", match-runtime = true },
  "packaging",
  "wheel",
  "setuptools",
  "ninja"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=term-missing --cov-report=xml"
markers = [
  "real_model: opt-in tests that exercise the actual Qwen backend"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["app", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMissingImports = false
