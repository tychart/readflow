# Alembic configuration for ReadFlow.
#
# The database URL is NOT stored here: `alembic/env.py` reads it from
# `READFLOW_DATABASE_URL` / `DATABASE_URL` (or the repo-root `.env` through the
# same settings object the app uses), so there is one place that knows how to
# reach the database and no credential is committed.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# Revision ids are timestamps, so a new migration always sorts after the last.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
